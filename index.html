<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Oahu Drive</title>
<style>
body{margin:0;background:#f4f8f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#15343a}
.wrap{max-width:520px;margin:auto;padding:24px 16px 40px}
h1{margin:0 0 5px;font-size:28px}.sub{color:#6b7d80;margin-bottom:18px}
.card{background:white;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 7px 24px rgba(0,0,0,.07)}
label{display:block;color:#687b7e;font-size:13px;margin-bottom:6px}
select{display:block;width:100%;font-size:17px;padding:14px 10px;margin-bottom:14px;border:1px solid #dce8e6;border-radius:12px;background:white;color:#15343a}
.result{text-align:center;font-size:35px;font-weight:800;padding:10px 0 15px}
.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:13px;padding:14px;text-align:center;font-size:16px;font-weight:700;text-decoration:none}
.map{background:#0b6e75;color:white}.swap{background:#e7f1ef;color:#0b6e75;margin-top:9px}
h2{font-size:18px;margin:0 0 12px}.places{font-size:14px;line-height:1.9}
.note{font-size:12px;color:#6b7d80;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>🌴 Oahu Drive</h1>
<div class="sub">오아후 여행 이동시간</div>

<div class="card">
<label for="from">출발지</label>
<select id="from">
<option value="0" selected>🏨 쉐라톤 와이키키</option>
<option value="1">🏖️ 카할라</option>
<option value="2">🌊 웨이메아 베이</option>
<option value="3">🌺 폴리네시안 문화센터 (PCC)</option>
<option value="4">🍍 돌 플랜테이션</option>
<option value="5">🦖 쿠알로아 랜치</option>
</select>

<label for="to">도착지</label>
<select id="to">
<option value="0">🏨 쉐라톤 와이키키</option>
<option value="1">🏖️ 카할라</option>
<option value="2">🌊 웨이메아 베이</option>
<option value="3" selected>🌺 폴리네시안 문화센터 (PCC)</option>
<option value="4">🍍 돌 플랜테이션</option>
<option value="5">🦖 쿠알로아 랜치</option>
</select>

<div class="result" id="result">약 1시간 15분</div>
<a id="maps" class="btn map" href="https://www.google.com/maps/dir/?api=1&origin=Sheraton%20Waikiki%20Beach%20Resort%2C%20Honolulu%2C%20HI&destination=Polynesian%20Cultural%20Center%2C%20Laie%2C%20HI&travelmode=driving">🗺️ Google Maps 실시간 길찾기</a>
<button class="btn swap" id="swap" type="button">⇅ 출발/도착 바꾸기</button>
</div>

<div class="card">
<h2>📍 등록 장소</h2>
<div class="places">
🏨 쉐라톤 와이키키<br>
🏖️ 카할라 (The Kahala Hotel & Resort)<br>
🌊 웨이메아 베이 (North Shore 기준)<br>
🌺 폴리네시안 문화센터 (PCC)<br>
🍍 돌 플랜테이션<br>
🦖 쿠알로아 랜치
</div>
</div>

<div class="card">
<div class="note">※ 표시 시간은 여행 계획용 예상치입니다. 실제 출발할 때는 Google Maps 실시간 길찾기로 교통상황을 확인하세요.</div>
</div>
</div>

<script>
var names=[
"Sheraton Waikiki Beach Resort, Honolulu, HI",
"The Kahala Hotel & Resort, Honolulu, HI",
"Waimea Bay Beach Park, Haleiwa, HI",
"Polynesian Cultural Center, Laie, HI",
"Dole Plantation, Wahiawa, HI",
"Kualoa Ranch, Kaneohe, HI"
];
var times=[
[0,20,75,75,40,50],
[20,0,75,65,55,40],
[75,75,0,35,22,50],
[75,65,35,0,50,23],
[40,55,22,50,0,45],
[50,40,50,23,45,0]
];
function fmt(m){
 if(m===0)return "같은 장소";
 if(m<60)return "약 "+m+"분";
 var h=Math.floor(m/60), r=m%60;
 return "약 "+h+"시간"+(r ? " "+r+"분" : "");
}
function update(){
 var f=document.getElementById("from"), t=document.getElementById("to");
 var a=parseInt(f.value,10), b=parseInt(t.value,10);
 document.getElementById("result").textContent=fmt(times[a][b]);
 document.getElementById("maps").href="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(names[a])+"&destination="+encodeURIComponent(names[b])+"&travelmode=driving";
}
document.getElementById("from").addEventListener("change",update);
document.getElementById("to").addEventListener("change",update);
document.getElementById("swap").addEventListener("click",function(){
 var f=document.getElementById("from"), t=document.getElementById("to"), x=f.value;
 f.value=t.value;t.value=x;update();
});
update();
</script>
</body></html>
